<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studi Kasus 1: Profil Card Sederhana</title>
    <style>
        /* TUGAS:
           1. Berikan kontener lebar 300px, padding 24px, border-radius 12px, dan box-shadow.
           2. Buat avatar menjadi bulat dengan border-radius 50%.
           3. Ganti warna background tombol, hapus border, dan tambahkan efek hover (transform/cursor).
        */
        * {box-sizing: border-box;}
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; padding: 50px; background-color: #f4f7f6; }
        .kontener {
            width: 300px;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .avatar {
            border-radius: 50%;
            width: 100%;
        }
        
        button {
            background-color: #007bff;
            border: none;
            color: white;
            padding: 10px 20px;
            cursor: pointer;
        }
        
        button:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="kontener">
        <img src="d:\Foto\WhatsApp Image 2026-04-17 at 17.07.57.jpeg" alt="Avatar" class="avatar">
        <h2>Hidayat Pratama</h2>
        <p style="color: #666; font-size: 0.9em; margin-top: -10px;">Backend Developer | Tech Enthusiast</p>
        <p style="font-size: 0.85em; margin-bottom: 20px;">Dedicated to building scalable and efficient web applications.</p>
        <button>Follow Hidayat</button>
    </div>
</body>
</html>
